name: refresh-profile
on:
  schedule:
    - cron: "0 */6 * * *"   # banner + contribution graph
    - cron: "30 3 * * 1"    # weekly: re-screenshot the project cards
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/make_header.py
      - run: python scripts/contributions.py
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_USER: Gideonjon
      - name: Project cards
        if: github.event_name != 'schedule' || github.event.schedule == '30 3 * * 1'
        run: |
          pip install -q playwright
          python scripts/cards.py
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || (git commit -m "refresh profile images" && git push)
